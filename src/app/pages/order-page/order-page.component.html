<section class="py-5">
  <div class="container">
    <!-- Step Navigation -->
    <ul class="nav nav-pills justify-content-center mb-5">
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['../']">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link active" href="#">QR Code Details</a>
      </li>
      <li class="nav-item">
        <a class="nav-link disabled" tabindex="-1" aria-disabled="true"
          >Payment</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link disabled" tabindex="-1" aria-disabled="true"
          >Processing</a
        >
      </li>
    </ul>

    <!-- Step 1: QR Code Details Form -->
    <div class="card shadow-sm border-0 p-4 rounded-4">
      <h4 class="fw-bold mb-4">Step 1: Enter QR Code Details</h4>

      <form>
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label fw-medium">QR Code Prefix</label>
            <input type="text" class="form-control" placeholder="e.g. QR-" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-medium">Leading Zeros</label>
            <input type="number" class="form-control" placeholder="e.g. 3" />
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-4">
            <label class="form-label fw-medium">Range (From)</label>
            <input type="number" class="form-control" placeholder="e.g. 1" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-medium">Range (To)</label>
            <input type="number" class="form-control" placeholder="e.g. 500" />
          </div>
        </div>

        <div class="text-end">
          <button class="btn btn-primary px-4">Next → Payment</button>
        </div>
      </form>
    </div>
  </div>
</section>
