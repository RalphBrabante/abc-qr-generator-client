  <div class="card shadow-sm auth-card w-100">
    <div class="card-body p-4 p-md-5 mt-">
      <!-- Brand -->

        <a class="text-decoration-none d-inline-flex align-items-center" href="#">

      <!-- 
      <h1 class="h4 text-center mb-1">Sign in</h1>
      <p class="text-secondary text-center mb-4">Welcome back. Please enter your details.</p> -->

      <!-- Server error alert (show when needed) -->
      <!-- <div class="alert alert-danger" role="alert">Invalid email or password.</div> -->

      <form [formGroup]="loginForm" (submit)="onSubmit()">
        <!-- CSRF placeholder -->
        <!-- <input type="hidden" name="__RequestVerificationToken" value="{{ token }}"> -->

        @if(errorMessageAlert){
        <ngb-alert type="danger" [animation]="true">{{
          errorMessageAlert
        }}</ngb-alert>
        }
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="username"
            required
            formControlName="emailAddress"
          />
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>

        <div class="mb-2">
          <div class="d-flex justify-content-between">
            <label for="password" class="form-label mb-0">Password</label>
            <a href="/forgot-password" class="small">Forgot password?</a>
          </div>
          <div class="input-group">
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Your password"
              autocomplete="current-password"
              required
              minlength="6"
              formControlName="password"
            />
            <button
              class="btn btn-outline-secondary"
              type="button"
              id="togglePassword"
              aria-label="Show password"
            >
              Show
            </button>
          </div>
          <div class="invalid-feedback">
            Please enter your password (at least 6 characters).
          </div>
        </div>

        <div class="mb-3 form-check">
          <input
            class="form-check-input"
            type="checkbox"
            value="true"
            id="remember"
            name="remember"
          />
          <label class="form-check-label" for="remember">Remember me</label>
        </div>

        <div class="d-grid gap-2">
          <button class="btn btn-primary" type="submit">Sign in</button>
        </div>

        <!-- Divider -->
        <div class="text-center my-3">
          <span class="text-secondary small">or</span>
        </div>
      </form>

      <!-- Sign up link -->
      <p class="text-center mt-4 mb-0 small">
        Don’t have an account? <a href="/register">Create one</a>
      </p>
    </div>
  </div>
</main>
